<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Vídeo</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}
</style>
</head>

<body>

<video
  id="video"
  autoplay
  muted
  playsinline
  preload="auto"
>
  <source src="video.mp4" type="video/mp4">
</video>

<script>
const video = document.getElementById("video");

video.muted = true;
video.defaultMuted = true;

async function iniciar() {
  try {
    video.muted = true;

    if (video.readyState >= 2) {
      await video.play();
    } else {
      video.load();
    }
  } catch (e) {}
}

video.addEventListener("loadeddata", iniciar);
video.addEventListener("canplay", iniciar);
video.addEventListener("progress", iniciar);

document.addEventListener("DOMContentLoaded", iniciar);
window.addEventListener("pageshow", iniciar);
window.addEventListener("focus", iniciar);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) iniciar();
});

iniciar();
</script>

</body>
</html>
