<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vídeo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #soundButton,
    #playButton {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      padding: 14px 22px;
      border: 1px solid rgba(255,255,255,0.5);
      border-radius: 30px;
      background: rgba(0,0,0,0.70);
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
      white-space: nowrap;
    }

    #soundButton {
      bottom: 7%;
    }

    #playButton {
      top: 50%;
      transform: translate(-50%, -50%);
      display: none;
      font-size: 18px;
      padding: 18px 28px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="container">

    <video
      id="video"
      autoplay
      muted
      playsinline
      webkit-playsinline
      preload="auto"
    >
      <source src="video.mp4" type="video/mp4">
    </video>

    <button id="playButton">
      ▶ INICIAR VÍDEO
    </button>

    <button id="soundButton">
      🔊 TOQUE PARA ATIVAR O SOM
    </button>

  </div>

  <script>
    const video = document.getElementById("video");
    const soundButton = document.getElementById("soundButton");
    const playButton = document.getElementById("playButton");

    video.muted = true;
    video.defaultMuted = true;

    function tentarAutoplay() {
      video.muted = true;

      const tentativa = video.play();

      if (tentativa !== undefined) {
        tentativa
          .then(() => {
            playButton.classList.add("hidden");
          })
          .catch(() => {
            playButton.style.display = "block";
          });
      }
    }

    document.addEventListener("DOMContentLoaded", tentarAutoplay);
    window.addEventListener("load", tentarAutoplay);
    video.addEventListener("loadedmetadata", tentarAutoplay);
    video.addEventListener("canplay", tentarAutoplay);

    playButton.addEventListener("click", () => {
      video.muted = false;
      video.volume = 1;

      video.play().then(() => {
        playButton.classList.add("hidden");
        soundButton.classList.add("hidden");
      });
    });

    soundButton.addEventListener("click", () => {
      video.muted = false;
      video.volume = 1;
      video.play();
      soundButton.classList.add("hidden");
    });
  </script>

</body>
</html>
