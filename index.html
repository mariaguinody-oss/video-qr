<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Vídeo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
    }

    video {
      width: 100vw;
      height: 100dvh;
      display: block;
      object-fit: contain;
      background: #000;
    }
  </style>
</head>

<body>

  <video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto"
    loop
    disablepictureinpicture
  >
    <source src="video.mp4" type="video/mp4">
  </video>

  <script>
    const video = document.getElementById("video");

    video.muted = true;
    video.defaultMuted = true;

    function iniciar() {
      video.play().catch(() => {});
    }

    document.addEventListener("DOMContentLoaded", iniciar);
    window.addEventListener("load", iniciar);
    video.addEventListener("canplay", iniciar);
  </script>

</body>
</html>
