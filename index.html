<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vídeo</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    background:black;
    overflow:hidden;
}

video{
    width:100vw;
    height:100vh;
    object-fit:cover;
}
</style>
</head>

<body>

<video id="video" autoplay muted playsinline preload="auto">
    <source src="video.mp4" type="video/mp4">
</video>

<script>
window.onload = function() {
    const video = document.getElementById("video");
    video.play().catch(() => {});
};
</script>

</body>
</html>
