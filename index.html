<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vídeo</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    body {
      position: fixed;
      inset: 0;
    }

    #video {
      width: 100vw;
      height: 100dvh;
      object-fit: contain;
      background: #000;
      display: block;
    }

    #fullscreenHint {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 17px;
      border-radius: 22px;
      background: rgba(0,0,0,.55);
      color: white;
      font-family: Arial, sans-serif;
      font-size: 13px;
      opacity: .8;
      z-index: 10;
      pointer-events: none;
      transition: opacity .4s;
    }
  </style>
</head>

<body>

  <video
    id="video"
    autoplay
    muted
    playsinline
    webkit-playsinline
    preload="auto"
    loop
  >
    <source src="video.mp4" type="video/mp4">
  </video>

  <div id="fullscreenHint">
    Toque para tela cheia
  </div>

  <script>
    const video = document.getElementById("video");
    const hint = document.getElementById("fullscreenHint");

    video.muted = true;
    video.defaultMuted = true;

    function iniciarVideo() {
      video.play().catch(() => {});
    }

    document.addEventListener("DOMContentLoaded", iniciarVideo);
    window.addEventListener("load", iniciarVideo);
    video.addEventListener("canplay", iniciarVideo);

    async function telaCheia() {
      try {
        if (document.documentElement.requestFullscreen) {
          await document.documentElement.requestFullscreen();
        } else if (video.webkitEnterFullscreen) {
          video.webkitEnterFullscreen();
        }

        hint.style.opacity = "0";
      } catch (e) {}
    }

    document.body.addEventListener("click", telaCheia, { once: true });
    document.body.addEventListener("touchend", telaCheia, { once: true });
  </script>

</body>
</html>
