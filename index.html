<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="theme-color" content="#000000">

<title>Vídeo</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
}

video {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  background: #000;
}
</style>
</head>

<body>

<video
  id="video"
  autoplay
  muted
  playsinline
  webkit-playsinline
  preload="auto"
  disablepictureinpicture
>
  <source src="video.mp4" type="video/mp4">
</video>

<script>
const video = document.getElementById("video");

video.muted = true;
video.defaultMuted = true;
video.setAttribute("muted", "");
video.setAttribute("playsinline", "");
video.setAttribute("webkit-playsinline", "");

function iniciarVideo() {
  if (video.paused) {
    video.play().catch(() => {});
  }
}

document.addEventListener("DOMContentLoaded", iniciarVideo);
window.addEventListener("load", iniciarVideo);

video.addEventListener("loadedmetadata", iniciarVideo);
video.addEventListener("loadeddata", iniciarVideo);
video.addEventListener("canplay", iniciarVideo);
video.addEventListener("canplaythrough", iniciarVideo);

setTimeout(iniciarVideo, 100);
setTimeout(iniciarVideo, 300);
setTimeout(iniciarVideo, 700);
setTimeout(iniciarVideo, 1200);

</script>

</body>
</html>
